<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}To-Do{% endblock %} · To-Do</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">✓ To-Do</a>
    {% if session.user_id %}
      <div class="who">
        <span>Hi, <strong>{{ session.name }}</strong></span>
        <form method="post" action="{{ url_for('logout') }}">
          <button class="btn btn-ghost" type="submit">Log out</button>
        </form>
      </div>
    {% endif %}
  </header>
  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='validate.js') }}"></script>
</body>
</html>
